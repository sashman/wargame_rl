opponent_models:
  - { group_id: 0, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 0, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 0, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 0, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 0, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 1, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 1, weapons: [{ range: 12, attacks: 1 }] }
