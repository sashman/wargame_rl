config_name: 25v25_beat_share
#
# BATCH 4 ROUND 4, ARM "SHARE" -- PROTOTYPE.
#
# Identical to 25v25_beat_observe.yaml except for objective_hold's weight and
# its new `crowding_exponent`. One thing varies: how an objective's value is
# split between the models standing on it.
#
# WHY THIS ARM EXISTS -- a measured allocation failure, not a hunch.
# `just measure-objective-split` breaks `objectives_held` down by *why* each
# objective was not held. At 1000 epochs, per episode (n=100, seeds 700000+):
#
#                        agent (observe)      squad_march_shoot (the bar)
#   models alive              15.8                      9.8
#   busiest objective   12.89 v 0.25 enemy       6.95 v 0.25 enemy
#   second objective     2.72 v 4.22 enemy       2.68 v 3.04 enemy
#   second held rate          0.48                     0.64
#   surplus models           14.13                     7.93
#   objectives held           1.42                     1.64
#   redistribution ceiling    2.06                     1.88
#
# The agent parks 12.9 models on a point defended by a quarter of a model --
# where one would do -- and loses the second by a model and a half. It is not
# short of material: it survives 60% better than the bar and out-guns it 2.7x.
# Moving the surplus would reach 2.06 held, past the bar's 1.64, and held is
# worth roughly 62 vp_margin per objective on this scenario.
#
# WHY THE FLAT DEFAULT CANNOT GET THERE. objective_hold pays every occupant the
# same 0.25/step, so the thirteenth model on a point earns exactly what the
# first does. No model ever has a private reason to leave, whatever the weights.
#
# WHY NOT `surplus_value`, which was aimed at this and measured null-to-negative
# (round 2 above). It is a cliff keyed on a rank -- distance to centre -- that a
# model cannot observe about itself, and it strictly *lowers* total objective
# income, so the policy reads it as "objectives pay less". `crowding_exponent`
# is smooth, keyed only on the occupant count that `observe_objective_control`
# now puts in the observation, and at a = 1 it conserves the pot: a point pays
# its value once, split among its occupants. Spreading onto a second point
# therefore *raises* total income instead of lowering it.
#
# CALIBRATION. Weight is set so the occupancy that actually holds the contested
# objective -- 5 models, against the measured 4.22 defenders -- is paid exactly
# today's 0.25/step. The arms then differ only in how sharply crowding is
# punished, not in the price of correct play:
#
#   arm         exponent   weight   pay at k=5   at k=13   at k=1
#   share          1.0      1.25       0.250      0.096     1.250
#   share_soft     0.5      0.56       0.250      0.155     0.560
#
# RISK, stated up front: at k=1 the `share` arm pays 1.25/step, which over a
# 40-step episode integrates to 50 -- far above the ~10 this config's design
# rules ask of any shaping term. A lone holder should be rare and transient, but
# if the agent learns to scatter single models onto undefended points and stops
# fighting, that is the term drowning the objective. `share_soft` caps at 0.56
# for the same reason and is the fallback if so.
#
# READ: objectives_held first, then vp_margin. Occupancy (`on_obj`) is expected
# to FALL here and that is not by itself a failure -- it cannot tell 13 models
# on one point from 5 each on three, which is the entire mistake this arm exists
# to correct. Cross-check with `just measure-objective-split`.
#
# ---------------------------------------------------------------------------
# Inherited from BATCH 3, ARM H -- the control.
#
# Batch 1/2 established that the agent manages range rather than using terrain.
# That was measured in a world where cover could not work (5.8% of the board
# hidden from a squad that could shoot it), could not be seen (no line-of-sight
# input at movement time) and was worth nothing (no cost for losing a model).
# Batch 3 fixed all three and re-asked the question as a 2x2 over signal x
# reason. It ran, and the answer was still no -- exposure 0.092-0.110 across
# every arm. See reports/2026-08-06-cover-signal-reason-geometry.md.
#
#   H  this file      no loss penalty
#   J  _cover_reason  loss penalty -- the only lever that moved anything
#
# The signal axis (a per-model line-of-sight input) measured null on both seeds
# and has been removed along with its two arms.
#
# Both share this terrain profile, so H is the arm the other is compared
# against. The profile changed from batch 2, so NO batch-3 number is comparable
# to batch 1 or batch 2, and the baselines must be re-measured.
#
number_of_wargame_models: 25
number_of_opponent_models: 25
number_of_objectives: 3
objective_radius_size: 3
board_width: 60
board_height: 44
max_groups: 5
turn_order: random
number_of_battle_rounds: 20
skip_phases:
  - command
  - charge
  - fight

deployment_zone: [0, 0, 20, 44]
opponent_deployment_zone: [40, 0, 60, 44]

# Shoots back. Every other opponent policy is movement-only, which leaves
# terrain constraining only the player's own shooting and gives cover no value
# whatsoever. Note this invalidates every baseline and agent score previously
# measured against the movement-only opponent.
opponent_policy:
  type: scripted_advance_and_shoot

# Terrain blocks line-of-sight only (models can still move through it), and is
# regenerated every episode rather than fixed.
#
# Randomising it is what makes a cover result falsifiable. With a fixed layout,
# "the policy learned to use cover" and "the policy memorised the rectangles"
# produce the same numbers. A fresh layout each episode leaves only one way to
# score: read the terrain tokens in the observation.
#
# 29 pieces of 3-7, not batch 2's 7 pieces of 5-7. Measured with
# `just measure-terrain`, the old profile left only 5.8% of the board hidden
# from a squad that could shoot it; this one leaves 18.6%. Count dominates size
# for this: hiding means breaking *every* sightline at once, which needs ruins
# in many directions rather than one big one. At 5.8% the batch-1/2 agent was
# not declining to use cover -- there was almost none to use.
#
# `count` is fixed while size and position vary -- observation batching stacks
# the terrain arrays of a whole batch, so the piece count cannot differ between
# episodes. `mirror` keeps the two deployment zones on equal ground; they are
# fixed to the left and right of the board, so an asymmetric draw would hand one
# side better approaches for a whole run.
random_terrain:
  count: 29
  min_size: 3
  max_size: 7
  mirror: true
  edge_margin: 2
  min_gap: 1

# Accumulate line-of-sight exposure and terrain proximity during shooting
# phases. Measurement only — it does not change the game. Without it the
# question this config exists to answer cannot be read off a run at all.
track_exposure: true

# 5 groups of 5. `weapons` is required for shooting to resolve at all — with an
# empty list a model cannot shoot, which also makes terrain LOS inert.
# range 12 on a 60x44 board puts the engagement band at a scale where a ~6-cell
# ruin actually breaks a firing lane.
# Objectives are drawn independently by default, which puts two of three discs
# on top of each other in ~25% of episodes -- silently turning a three-objective
# mission into a two-objective one. 6 = 2 x objective_radius_size, the smallest
# separation that keeps the discs disjoint.
objective_min_separation: 6

models:
  - { group_id: 0, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 0, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 0, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 0, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 0, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 1, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 1, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 1, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 1, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 1, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 2, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 2, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 2, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 2, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 2, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 3, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 3, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 3, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 3, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 3, weapons: [{ range: 12, attacks: 1 }] }
  - { group_id: 4, weapons: [{ range: 12, attacks: 1 }] }
