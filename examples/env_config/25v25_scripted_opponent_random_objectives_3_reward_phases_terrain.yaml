# No `objectives:` block -> the 3 objectives (number_of_objectives) are placed
# randomly outside both deployment zones at the start of every episode.

reward_phases:
  # !! EVERY THRESHOLD BELOW IS UNCALIBRATED. Treat them as placeholders. !!
  #
  # The numbers that used to be documented here were measured under three
  # conditions that have since been shown false or fixed:
  #   1. Training reward always came from phase 0 regardless of the reported
  #      phase (the rollout envs built their own RewardPhaseManager), so no
  #      phase-1/2/3 threshold was ever measured against its own reward.
  #   2. The opponent moved four times per round to the player's one, so it
  #      held every objective before VP scoring opened at round 2.
  #   3. The rollout envs replayed 8 fixed layouts every epoch while eval drew
  #      random ones.
  # Conditions 2 and 3 are fixed; the measurements taken under them are not
  # recoverable and have been removed rather than left to mislead.
  #
  # Re-derive rungs with `just measure-baselines <this config>` for the
  # reachable range and `just measure-phase-gates <ckpt> <this config>` for a
  # policy's live per-epoch rate. Size against the *live* rate the gate reads,
  # never a best-checkpoint sweep: best checkpoints are selected on reward and
  # run 10-15 points optimistic. Keep the ladder monotonic — a rung measured
  # harder than a later rung stalls everything behind it.
  #
  # What survives, because it is arithmetic rather than measurement:
  #   - `all_at_objectives` is unreachable at this army size: with per-model
  #     accuracy p, success needs p**25.
  #   - `min_epochs_above_threshold` demands *consecutive* epochs above the bar,
  #     and each epoch's success_rate is an n_episodes-sample binomial. At
  #     n_episodes=10 a run of 10 readings >= 0.7 needs a true rate near 0.85.
  #     Launch with --n-eval-episodes 30 and a run of 3.
  #   - `models_at_objectives` is the dense counterpart of the fraction
  #     criteria. Without it the phase is gated on a quantity nothing pays for:
  #     `objective_coverage` saturates once the player out-counts the opponent
  #     (~2 models a point) and `closest_objective` pays for approaching, not
  #     staying.
  - name: approach_objectives
    terminal_success_bonus: 3.0
    terminate_on_success: false
    reward_calculators:
      - type: closest_objective
        weight: 1.0
        params: { progress_scale: 10.0 }
      # Weighted above objective_coverage because occupancy, not control, is
      # what the criteria measures. Recorded matches show the policy reaching
      # objectives then leaving them (peak 3/4 -> final 1/4): `closest_objective`
      # with progress_scale is a potential, so a round trip away and back sums
      # to zero and nothing opposes drift. Only a per-step occupancy term makes
      # holding strictly better than oscillating.
      - type: models_at_objectives
        weight: 1.0
      - type: objective_coverage
        weight: 0.3
    success_criteria:
      type: fraction_at_objectives
      params: { min_fraction: 0.15 }
    # Placeholder — see the uncalibrated warning at the top of reward_phases.
    # For reference, the scripted `squad_march` baseline saturates this
    # criteria (1.00 final fraction on objectives) on this config, so the
    # reachable ceiling here is 1.0 and this rung is not the hard part.
    success_threshold: 0.45
    min_epochs: 0
    min_epochs_above_threshold: 3

  # Massing enough models to hold a point. objective_coverage is weighted up
  # because reaching 40% across 3 objectives requires spreading, not stacking;
  # group_cohesion is live now that groups have 5 members each.
  - name: mass_on_objectives
    terminal_success_bonus: 3.0
    terminate_on_success: false
    reward_calculators:
      - type: closest_objective
        weight: 0.5
        params: { progress_scale: 10.0 }
      - type: models_at_objectives
        weight: 1.5
      - type: objective_coverage
        weight: 0.8
      - type: group_cohesion
        weight: 0.5
        params: { group_max_distance: 5.0, violation_penalty: -0.1 }
    success_criteria:
      type: fraction_at_objectives
      params: { min_fraction: 0.2 }
    success_threshold: 0.25
    min_epochs: 20
    min_epochs_above_threshold: 3

  - name: win_only_by_vp
    terminal_success_bonus: 3.0
    terminate_on_success: false
    reward_calculators:
      - type: vp_gain
        weight: 1.0
      - type: objective_flip_bonus
        weight: 1.0
        params:
          {
            bonus_capture_first: 2.0,
            bonus_flip_to_contested: 1.0,
            bonus_contested_to_controlled: 2.0,
            loss_penalty_scale: 1.0,
          }
      - type: closest_objective_v2
        weight: 0.3
        params: { progress_scale: 10.0 }
      # Retained from the earlier phases so the objective-holding behaviour is
      # not forgotten the moment the dense shaping switches to VP.
      - type: models_at_objectives
        weight: 0.3
      - type: objective_coverage
        weight: 0.1
      - type: killing
        weight: 1.0
        params: { bonus_killing_opponent: 5.0 }
    success_criteria:
      type: player_vp_min
      params: { fraction_of_max: 0.3 }
    success_threshold: 0.25
    min_epochs: 20
    min_epochs_above_threshold: 3

  - name: win_at_the_end
    terminal_success_bonus: 3.0
    terminate_on_success: false
    reward_calculators:
      - type: vp_gain
        weight: 1.0
      - type: models_at_objectives
        weight: 0.2
      - type: objective_flip_bonus
        weight: 0.5
        params:
          {
            bonus_capture_first: 2.0,
            bonus_flip_to_contested: 1.0,
            bonus_contested_to_controlled: 2.0,
            loss_penalty_scale: 1.0,
          }
    success_criteria:
      type: player_ahead_on_vp
      params: {}
    success_threshold: 0.8
    min_epochs: 20
