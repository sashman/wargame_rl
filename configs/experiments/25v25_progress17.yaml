config_name: 25v25_progress17
#
# 25v25 on continuous ground, with polygon terrain and objectives that ARE the
# terrain. The phase-03 equivalent of configs/golden/25v25_shooting_opponent.yaml.
#
# It is deliberately a line-by-line copy of that config except for the four
# changes listed below, so that the comparison isolates the geometry rather than
# the scenario. Every other number -- army size, board, rounds, opponent, weapon
# range, reward weights -- is the same.
#
# NOTHING MEASURED ON THE GOLDEN CONFIG TRANSFERS TO THIS ONE. Not the +17.0
# bar, not the +28.4 agent score, not the terrain profile's 18.6% hidden. The
# board is continuous, a speed bin now travels the same distance in every
# direction, models have bases that occlude and collide, sight is a sampled ray
# against outlines with a three-state cover verdict, and the objectives have
# moved onto the ruins.
#
# WHAT IT SCORES. n=100, seeds 700000-700099, identical layouts:
#
#   policy                       win    vp_margin   held   alive
#   random (the floor)           0.01     -147.3    0.21   0.787
#   greedy_nearest               0.27      -34.2    0.95   0.571
#   squad_march                  0.42      -17.7    1.14   0.384
#   split_evenly                 0.45       +0.2    1.33   0.533
#   squad_march_shoot (the bar)  0.85      +58.9    1.82   0.499
#   contest_and_spread           0.84      +57.5    1.77   0.474
#
# Measured WITH objectives_spread_on_terrain. The clustered table (bar +67.7)
# is void here. Spreading lowers every shooting policy -- the bar 67.7 -> 59.4
# and contest_and_spread 70.7 -> 55.2 -- because marching every squad at the
# nearest objective is near-optimal only when the objectives are adjacent.
#
# On the 15 x 3-11 terrain fitted to the real layouts. The earlier
# table on 37 x 3-6 (bar +81.4) is VOID -- that profile gave more than double
# the real game's cover and objectives that held 5 models. Two things moved:
# the bar fell 81.4 -> 67.7, and `split_evenly` collapsed 58.2 -> 18.9, because
# spreading thin pays far less once an objective is big enough to contest
# properly. `contest_and_spread` now edges the bar rather than trailing it.
#
# Reproduce with:
#   just measure-baselines configs/experiments/25v25_polygon_terrain_objectives.yaml 100 "" 700000
#   just measure-checkpoint <ckpt> configs/experiments/25v25_polygon_terrain_objectives.yaml 100
#
# COVER IS WHY THE BAR IS SO HIGH. Before model occlusion and cover the same
# config scored the bar at +20.6 with 1.17 held and 0.28 alive; cover roughly
# doubles survival (0.48), and models that live hold ground. Note also that
# `contest_and_spread` is now the strongest scripted policy, narrowly ahead of
# the bar. `split_evenly` is not -- it led on the mis-scaled terrain, where
# objectives were too small to contest, and fell back once they were not.
#
# THE FOUR CHANGES.
#
#   base_radius: 0.63       32mm across, the rules' infantry base. Models can no
#                           longer share a spot: placement separates them, the
#                           board clamp insets by a radius, objective range is
#                           measured from the base edge, and engagement is base
#                           to base.
#   random_terrain.n_vertices: 6
#                           Convex hexagons inscribed in the same size box
#                           instead of axis-aligned rectangles. A mirrored pair
#                           is one outline and its reflection, and the unpaired
#                           centre piece of an odd count is built symmetric by
#                           construction.
#   objectives_on_terrain: true
#                           The three pieces nearest the board centre and clear
#                           of both deployment zones BECOME the objectives. The
#                           objective's outline is the footprint's outline, so
#                           the two are drawn on top of each other and control
#                           is standing on the ruin.
#   los_sample_step: 0.25   The sight-trace resolution. A blocker thinner than
#                           this can fall between two samples; min_size 3 leaves
#                           twelve times the margin.
#
# WHY OBJECTIVES ON TERRAIN IS A DIFFERENT MISSION, NOT A RESKIN. Everything
# previous experiments learned about this scenario assumed the prize sat in the
# open and the cover sat elsewhere -- `objective_terrain_clearance` exists
# specifically to arrange that. Here they are the same ground, so approaching
# the objective and taking cover stop being competing uses of a move. That is
# the point, and it is also why the cover results from batch 1-3 say nothing
# about this config.
#
# `objective_radius_size` and `objective_min_separation` are absent on purpose:
# an area objective has no radius and is not drawn, so both would be inert. A
# settable-but-inert field is how a lever silently does nothing.
# ---------------------------------------------------------------------------
number_of_wargame_models: 25
number_of_opponent_models: 25
number_of_objectives: 3
board_width: 60
board_height: 44
max_groups: 5
turn_order: random
number_of_battle_rounds: 20
skip_phases:
  - command
  - charge
  - fight

deployment_zone: [0, 0, 20, 44]
opponent_deployment_zone: [40, 0, 60, 44]

# Physical bases, in inches. At inches_per_unit 1.0 this is 0.63 board units.
base_radius: 0.63
los_sample_step: 0.25

# Shoots back. Every other opponent policy is movement-only, which leaves
# terrain constraining only the player's own shooting and gives cover no value
# whatsoever.
opponent_policy:
  type: scripted_advance_and_shoot

# Terrain blocks line-of-sight only (models can still move through it), and is
# regenerated every episode rather than fixed. Randomising it is what makes a
# positioning result falsifiable: with a fixed layout, "learned to use the
# terrain" and "memorised the shapes" produce the same numbers.
#
# 15 pieces of 3-11, FITTED TO THE 45 REAL LAYOUTS in configs/evaluation/maps/
# rather than tuned against `measure-terrain`. Fitting the metric is what went
# wrong the first time -- see below.
#
#   profile                     pieces   area   aspect   coverage   hidden
#   real maps (45, measured)      15.5   40.0     1.52      0.235    0.088
#   15 x 3-11 rects  <- this      15      38.7     1.50      0.223    0.111
#   37 x 3-6 hexagons (was)       37      11.3     ~1.3      0.159    0.194
#
# The 37 x 3-6 profile was wrong on every axis and the errors compounded:
#
#   1. `measure_terrain._coverage` billed each piece's BOUNDING BOX, and an
#      inscribed hexagon fills ~65% of its box. The old header's "coverage
#      0.233" was really 0.159. Fixed now -- it measures polygon area.
#   2. The profile was then tuned to maximise "cells hidden from a squad", and
#      that metric rewards piece COUNT ("count dominates size" is true and is
#      exactly the trap). Maximising it drove 37 tiny pieces.
#   3. The result gave 0.194 hidden against the real game's 0.088 -- more than
#      DOUBLE the cover a real table offers. Every cover experiment run on it
#      was asking "does the agent use cover" in a world with twice as much.
#
# So this profile is fitted to the real layouts and *checked* with
# `measure-terrain`, never fitted to it. Hidden lands at 0.111 against the real
# 0.088, inside the real maps' own spread (0.000-0.273).
#
# Rectangles, not hexagons: 4-vertex pieces are what the real maps are, and
# `_sample_piece` draws width and height independently, so a 3-11 range gives a
# median aspect ratio of 1.50 against the real 1.52. The earlier profile could
# not express this -- raising min_size to 5 or 6 to get bigger pieces pushes the
# mean box area up and the packing validator rejects it. A low floor with a high
# ceiling is what produces real-looking terrain AND loads.
#
# Why this matters more than cover: objectives ARE terrain footprints, and
# models now have a 1.26" base that cannot overlap another. Under 37 x 3-6 an
# objective held 5.0 models and 48 of 90 could not fit one 5-model squad. Under
# this profile it is 18.2 models and 4 of 90 -- which restores the regime
# `objective_hold.crowding_exponent` was tuned in, where stacking is a real
# choice the reward can price.
#
# `count` is fixed while size and position vary -- observation batching stacks
# the terrain arrays of a whole batch, so the piece count cannot differ between
# episodes. `mirror` keeps the two deployment zones on equal ground.
#
# The count also has to leave at least `number_of_objectives` pieces clear of
# both deployment zones, or `objectives_on_terrain` fails at reset -- which is
# what killed a run at epoch 619. 2000 consecutive resets on this profile: zero
# failures.
random_terrain:
  count: 15
  min_size: 3
  max_size: 11
  mirror: true
  edge_margin: 2
  min_gap: 1

# The objectives are the terrain.
objectives_on_terrain: true

# Choose the eligible pieces that are furthest apart, not the ones nearest the
# board centre. Nearest-to-centre packed all three objectives into a ~16" circle
# on this 60x44 board with 47% of pairs inside one weapon range, so holding two
# was nearly free and there was no travel trade-off to price. Measured as a
# natural experiment across 60 layouts, the agent's paired margin against the
# bar improves +36.9 vp (3.6 sigma) going from clustered to spread layouts --
# and the bar itself falls 79.7 -> 50.8, because marching every squad at the
# nearest objective is near-optimal only when everything is adjacent.
#
# This CHANGES THE SCENARIO. Every baseline measured without it is void.
objectives_spread_on_terrain: true

# Accumulate line-of-sight exposure and terrain proximity during shooting
# phases. Measurement only -- it does not change the game.
track_exposure: true

# Five squads of five, all one profile. The anchors single-source that: a
# weapon change is one edit rather than fifty, and "every model is the same"
# is visible instead of inferred.
#
# `group_id` is this project's name for the rules' *unit*, so these five squads
# are also five units for the sight rule: a model ignores its own group, and its
# target's group, when tracing. Numbering is per army, so player group 0 and
# opponent group 0 are different groups.
models:
  - &squad_0 { group_id: 0, weapons: &rifle [{ range: 12, attacks: 1 }] }
  - *squad_0
  - *squad_0
  - *squad_0
  - *squad_0
  - &squad_1 { group_id: 1, weapons: *rifle }
  - *squad_1
  - *squad_1
  - *squad_1
  - *squad_1
  - &squad_2 { group_id: 2, weapons: *rifle }
  - *squad_2
  - *squad_2
  - *squad_2
  - *squad_2
  - &squad_3 { group_id: 3, weapons: *rifle }
  - *squad_3
  - *squad_3
  - *squad_3
  - *squad_3
  - &squad_4 { group_id: 4, weapons: *rifle }
  - *squad_4
  - *squad_4
  - *squad_4
  - *squad_4

opponent_models:
  - &opp_squad_0 { group_id: 0, weapons: *rifle }
  - *opp_squad_0
  - *opp_squad_0
  - *opp_squad_0
  - *opp_squad_0
  - &opp_squad_1 { group_id: 1, weapons: *rifle }
  - *opp_squad_1
  - *opp_squad_1
  - *opp_squad_1
  - *opp_squad_1
  - &opp_squad_2 { group_id: 2, weapons: *rifle }
  - *opp_squad_2
  - *opp_squad_2
  - *opp_squad_2
  - *opp_squad_2
  - &opp_squad_3 { group_id: 3, weapons: *rifle }
  - *opp_squad_3
  - *opp_squad_3
  - *opp_squad_3
  - *opp_squad_3
  - &opp_squad_4 { group_id: 4, weapons: *rifle }
  - *opp_squad_4
  - *opp_squad_4
  - *opp_squad_4
  - *opp_squad_4

# ---------------------------------------------------------------------------
# Single reward phase, copied unchanged from the golden config so the geometry
# is the only variable. The design rules it follows, each traceable to a
# measurement:
#   * Every phase keeps vp_gain. Nothing here trains away from the goal.
#   * Every phase carries per-model terms. A phase built purely from global
#     ones hands all 25 models a bit-identical reward, undoing per-model credit
#     assignment by config.
#   * No term integrates far above ~10 over an episode.
#
# One caveat carried forward rather than silently assumed: `objective_hold`'s
# crowding_exponent divides a point's pot among its occupants, and an area
# objective holds far more models than a radius-3 disc did. The pot is still
# conserved, so spreading still pays more than stacking, but the per-model
# income at a *given* occupancy is not the same number it was -- which is one
# more reason no golden figure transfers.
# ---------------------------------------------------------------------------

# PROGRESS SCALE, set by calculation rather than guess. Measured per-model
# income on the spread_hold agent (n=15 episodes):
#
#   alone on an objective        1.30 / step
#   on a crowded one (8 others)  0.62
#   loitering outside            0.50
#   IN TRANSIT                   0.26   <- the trough
#
# The crowding gradient works -- pay falls monotonically 1.30 -> 0.36 from one
# occupant to twelve -- so arriving at an empty objective roughly doubles a
# model's income. But leaving costs 0.383/step for the ~3.3 rounds of a 20"
# walk (~1.26 of certain loss) before paying +0.66/step, which needs a
# SUSTAINED multi-round commitment that single-step exploration never finds.
# Five reward weightings moved abandonment by 2 points; this is why.
#
# progress paid 0.207/step in transit at scale 6.0, so covering the 0.383 gap
# needs roughly scale 17. Safe to raise hard: progress is potential-based and
# telescopes to scale * (initial - final distance), so walking back and forth
# cannot farm it.
reward_phases:
  - name: win
    terminate_on_success: false
    terminal_success_bonus: 2.0
    reward_calculators:
      # ---- per-model ----
      - type: closest_objective_v2
        weight: 1.0
        params:
          progress_scale: 17.0
          fallback_to_nearest: true
          overstack_penalty_per_extra: 0.01
      - type: objective_hold
        weight: 2.5
        params: { crowding_exponent: 1.0 }
      - type: model_kills
        weight: 1.0
        params: { bonus_per_kill: 2.0 }
      - type: group_cohesion
        weight: 0.3
        params: { group_max_distance: 6.0, violation_penalty: -0.05 }
      # ---- global (broadcast whole to each model, not divided by 25) ----
      - type: vp_gain
        weight: 2.0
      - type: objective_coverage
        weight: 0.1
    success_criteria:
      type: player_ahead_on_vp
      params: {}

observe_objective_control: true
