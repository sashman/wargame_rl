# Curriculum rung C1 (parent question #340): A3 plus ONE enemy unit of three
# standing on one of the four points, nobody shooting -- the "enemy" axis.
# The opponent deploys around the point at (35, 27) and holds
# (`hold_deployment`); success is still `all_objectives_occupied`, which
# counts OUR bodies on every point, so the rung asks whether the squad
# bound for that point still gets onto it with three enemy bases in the
# way -- a move may not end within engagement range of an enemy, and the
# disc is radius 4. Everything else is `a3.yaml`. Warm-started from A3x per
# the ladder's rule for the C rungs; the whole-army control runs beside it.
#
# The bar is `squad_march_take`, measured first on seeds 700000+, both facades.
config_name: curriculum_c1
number_of_wargame_models: 12
number_of_opponent_models: 3
number_of_objectives: 4
objective_radius_size: 4
board_width: 60
board_height: 44
max_groups: 4
number_of_battle_rounds: 8
deployment_zone: [4, 4, 10, 40]
opponent_deployment_zone: [32, 24, 38, 30]
models:
  - &sq_0 { group_id: 0 }
  - *sq_0
  - *sq_0
  - &sq_1 { group_id: 1 }
  - *sq_1
  - *sq_1
  - &sq_2 { group_id: 2 }
  - *sq_2
  - *sq_2
  - &sq_3 { group_id: 3 }
  - *sq_3
  - *sq_3
objectives:
  - { x: 35, y: 8 }
  - { x: 35, y: 17 }
  - { x: 35, y: 27 }
  - { x: 35, y: 36 }
coherency:
  enforce_at_deployment: true
reward_phases:
  - name: arrive
    terminate_on_success: true
    terminal_success_bonus: 5.0
    reward_calculators:
      - type: closest_objective_v2
        weight: 1.0
        params:
          progress_scale: 6.0
          fallback_to_nearest: true
          overstack_penalty_per_extra: 0.0
      - type: objective_coverage
        weight: 0.3
    success_criteria:
      type: all_objectives_occupied
      params: {}
observe_objective_control: true
opponent_policy:
  type: scripted_baseline
  params:
    baseline: hold_deployment
opponent_models:
  - &opp_0 { group_id: 0 }
  - *opp_0
  - *opp_0
