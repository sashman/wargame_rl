# #384, amendment 31 (2026-10-13): `a5_points_head_pf_pcm.yaml` (CC2's config) with
# ONE change: `commitments.observe_target_offset: true`, the offset from each
# soldier to its unit's committed objective written on the soldier's OWN token.
# Arm CC2t, read against CC2 (soldiers from scratch under PC's frozen planner).
config_name: curriculum_a5_points_head_pf_pcm_to
number_of_wargame_models: 18
number_of_opponent_models: 0
number_of_objectives: 5
objective_radius_size: 4
board_width: 60
board_height: 44
max_groups: 6
number_of_battle_rounds: 10
deployment_zone: [2, 2, 10, 42]
opponent_deployment_zone: [50, 2, 58, 42]
models:
  - &sq_0 { group_id: 0 }
  - *sq_0
  - *sq_0
  - &sq_1 { group_id: 1 }
  - *sq_1
  - *sq_1
  - &sq_2 { group_id: 2 }
  - *sq_2
  - *sq_2
  - &sq_3 { group_id: 3 }
  - *sq_3
  - *sq_3
  - &sq_4 { group_id: 4 }
  - *sq_4
  - *sq_4
  - &sq_5 { group_id: 5 }
  - *sq_5
  - *sq_5
objectives:
  - { x: 30, y: 8 }
  - { x: 30, y: 22 }
  - { x: 30, y: 36 }
  - { x: 45, y: 15 }
  - { x: 45, y: 29 }
reward_phases:
  - name: arrive
    terminate_on_success: true
    terminal_success_bonus: 5.0
    terminal_member_success_bonus: 0.5
    reward_calculators:
      - type: plan_following
        weight: 0.5
        params:
          max_move_distance: 6.0
      - type: group_cohesion
        weight: 0.3
        params: { group_max_distance: 6.0, violation_penalty: -0.05 }
      - type: objective_coverage
        weight: 0.3
      - type: commitment_coverage
        weight: 0.3
    success_criteria:
      type: all_objectives_occupied
      params: {}
observe_objective_control: true
coherency:
  enforce_at_deployment: true
commitments:
  assignment: head
  observe_target_offset: true
