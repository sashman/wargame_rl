# Curriculum rung A4 (parent question #340): FOUR units of three, THREE
# objectives, nobody shooting -- the "points" axis with a SPARE squad. A3's
# scenario with one point removed, so one squad has no point of its own:
# the record says five squads over five points pose no allocation question
# and it takes a surplus to make one (CLAUDE.md "Allocation"). Success is
# `all_objectives_occupied` -- every point has a body on it -- as on A3.
# Radius 4 per point, the deployment band the height of the board, 8 rounds,
# 60x44, Move 6, coherency a readout.
#
# The bar is `squad_march_take`, measured first on seeds 700000+.
config_name: curriculum_a4
number_of_wargame_models: 12
number_of_opponent_models: 0
number_of_objectives: 3
objective_radius_size: 4
board_width: 60
board_height: 44
max_groups: 4
number_of_battle_rounds: 8
deployment_zone: [4, 4, 10, 40]
opponent_deployment_zone: [50, 16, 56, 28]
models:
  - &sq_0 { group_id: 0 }
  - *sq_0
  - *sq_0
  - &sq_1 { group_id: 1 }
  - *sq_1
  - *sq_1
  - &sq_2 { group_id: 2 }
  - *sq_2
  - *sq_2
  - &sq_3 { group_id: 3 }
  - *sq_3
  - *sq_3
objectives:
  - { x: 35, y: 12 }
  - { x: 35, y: 22 }
  - { x: 35, y: 32 }
coherency:
  enforce_at_deployment: true
reward_phases:
  - name: arrive
    terminate_on_success: true
    terminal_success_bonus: 5.0
    reward_calculators:
      - type: closest_objective_v2
        weight: 1.0
        params:
          progress_scale: 6.0
          fallback_to_nearest: true
          overstack_penalty_per_extra: 0.0
      - type: objective_coverage
        weight: 0.3
    success_criteria:
      type: all_objectives_occupied
      params: {}
observe_objective_control: true
