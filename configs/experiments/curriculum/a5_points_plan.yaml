# #384 EXECUTION phase, arm EX1 (#400): the five-objective half-step with the
# environment's plan (greedy at deployment, arrived-keeps retirement) and the
# PLAN-WEIGHTED execution reward (`commitments.execution: plan`): a soldier is
# paid approach x the travel term while its squad has not yet arrived at its
# committed objective, hold x the staying term once it has, each keyed to that
# objective and nothing else -- leaving in hold mode pays exactly zero -- and
# the close's outcome terms (coverage, the success bonus) go to the planning
# stream, which no soldier sees. `objective_stay` at weight 1.0 (the staying
# arms ran 0.5 and 0.15 under one stream with the end bonus in the same
# reward). Read against CM1-R1 (the same plan under the keyed execution) and
# the staying arms. The bar is `squad_march_take`.
config_name: curriculum_a5_points_plan
number_of_wargame_models: 18
number_of_opponent_models: 0
number_of_objectives: 5
objective_radius_size: 4
board_width: 60
board_height: 44
max_groups: 6
number_of_battle_rounds: 10
deployment_zone: [2, 2, 10, 42]
opponent_deployment_zone: [50, 2, 58, 42]
models:
  - &sq_0 { group_id: 0 }
  - *sq_0
  - *sq_0
  - &sq_1 { group_id: 1 }
  - *sq_1
  - *sq_1
  - &sq_2 { group_id: 2 }
  - *sq_2
  - *sq_2
  - &sq_3 { group_id: 3 }
  - *sq_3
  - *sq_3
  - &sq_4 { group_id: 4 }
  - *sq_4
  - *sq_4
  - &sq_5 { group_id: 5 }
  - *sq_5
  - *sq_5
objectives:
  - { x: 30, y: 8 }
  - { x: 30, y: 22 }
  - { x: 30, y: 36 }
  - { x: 45, y: 15 }
  - { x: 45, y: 29 }
reward_phases:
  - name: arrive
    terminate_on_success: true
    terminal_success_bonus: 5.0
    reward_calculators:
      - type: closest_objective_v2
        weight: 1.0
        params:
          progress_scale: 6.0
          fallback_to_nearest: true
          overstack_penalty_per_extra: 0.0
      - type: objective_stay
        weight: 1.0
      - type: objective_coverage
        weight: 0.3
    success_criteria:
      type: all_objectives_occupied
      params: {}
observe_objective_control: true
coherency:
  enforce_at_deployment: true
commitments:
  assignment: greedy
  execution: plan
