# Curriculum rung A5 (parent question #340): EIGHT units of three, SIX
# objectives, nobody shooting -- the "bodies + points, same shape" rung, the
# spare-squads shape the full game poses (24v24_maps_spare_squads) without
# the guns, the terrain or the opponent. Two columns of points so the far
# column is 35-41" from the deployment band at Move 6; the clock is TEN
# rounds (at eight the script's bar read 0.98, at ten 1.00 -- the far column
# is at the edge of reach, and a rung's clock is part of its shape). Success
# is `all_objectives_occupied` as on A3 and A4; radius 4 per point; 60x44;
# coherency a readout. T1 warm-starts this rung from A4's checkpoint.
#
# The bar is `squad_march_take`, measured first on seeds 700000+.
config_name: curriculum_a5
number_of_wargame_models: 24
number_of_opponent_models: 0
number_of_objectives: 6
objective_radius_size: 4
board_width: 60
board_height: 44
max_groups: 8
number_of_battle_rounds: 10
deployment_zone: [2, 2, 10, 42]
opponent_deployment_zone: [50, 2, 58, 42]
models:
  - &sq_0 { group_id: 0 }
  - *sq_0
  - *sq_0
  - &sq_1 { group_id: 1 }
  - *sq_1
  - *sq_1
  - &sq_2 { group_id: 2 }
  - *sq_2
  - *sq_2
  - &sq_3 { group_id: 3 }
  - *sq_3
  - *sq_3
  - &sq_4 { group_id: 4 }
  - *sq_4
  - *sq_4
  - &sq_5 { group_id: 5 }
  - *sq_5
  - *sq_5
  - &sq_6 { group_id: 6 }
  - *sq_6
  - *sq_6
  - &sq_7 { group_id: 7 }
  - *sq_7
  - *sq_7
objectives:
  - { x: 30, y: 8 }
  - { x: 30, y: 22 }
  - { x: 30, y: 36 }
  - { x: 45, y: 8 }
  - { x: 45, y: 22 }
  - { x: 45, y: 36 }
reward_phases:
  - name: arrive
    terminate_on_success: true
    terminal_success_bonus: 5.0
    reward_calculators:
      - type: closest_objective_v2
        weight: 1.0
        params:
          progress_scale: 6.0
          fallback_to_nearest: true
          overstack_penalty_per_extra: 0.0
      - type: objective_coverage
        weight: 0.3
    success_criteria:
      type: all_objectives_occupied
      params: {}
observe_objective_control: true
coherency:
  enforce_at_deployment: true
