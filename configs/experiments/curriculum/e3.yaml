# Curriculum rung E3 (issue #335, parent #328): EIGHT units of three, SIX
# objectives, nobody shooting -- the spare-squads shape the full game poses
# (`configs/experiments/24v24_maps_spare_squads.yaml`), without the guns, the
# terrain or the opponent. It asks whether the set network still learns when
# the army is large, not whether the idea works on three models.
#
# The bar is `squad_march_take`. Success is 90% of alive models inside an
# objective. Two columns of markers so the far column is 35-41" from the
# deployment band at Move 6: the horizon is twelve rounds, and 0.85 means
# 21 of 24 models (0.9 would demand 22, and the script itself fails that).
config_name: curriculum_e3
number_of_wargame_models: 24
number_of_opponent_models: 0
number_of_objectives: 6
objective_radius_size: 3
board_width: 60
board_height: 44
max_groups: 8
number_of_battle_rounds: 12
deployment_zone: [2, 2, 10, 42]
opponent_deployment_zone: [50, 2, 58, 42]
models:
  - &sq_0 { group_id: 0 }
  - *sq_0
  - *sq_0
  - &sq_1 { group_id: 1 }
  - *sq_1
  - *sq_1
  - &sq_2 { group_id: 2 }
  - *sq_2
  - *sq_2
  - &sq_3 { group_id: 3 }
  - *sq_3
  - *sq_3
  - &sq_4 { group_id: 4 }
  - *sq_4
  - *sq_4
  - &sq_5 { group_id: 5 }
  - *sq_5
  - *sq_5
  - &sq_6 { group_id: 6 }
  - *sq_6
  - *sq_6
  - &sq_7 { group_id: 7 }
  - *sq_7
  - *sq_7
objectives:
  - { x: 30, y: 8 }
  - { x: 30, y: 22 }
  - { x: 30, y: 36 }
  - { x: 45, y: 8 }
  - { x: 45, y: 22 }
  - { x: 45, y: 36 }
reward_phases:
  - name: arrive
    terminate_on_success: true
    terminal_success_bonus: 5.0
    reward_calculators:
      - type: closest_objective_v2
        weight: 1.0
        params:
          progress_scale: 6.0
          fallback_to_nearest: true
          overstack_penalty_per_extra: 0.0
      - type: objective_coverage
        weight: 0.3
    success_criteria:
      type: fraction_at_objectives
      params: { min_fraction: 0.85 }
observe_objective_control: true
