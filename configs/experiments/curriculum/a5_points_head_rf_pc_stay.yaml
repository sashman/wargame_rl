# #384, amendment 25 (2026-09-27): the half-step recipe (CM11: the anchor on the
# commitment head, CM9c's reward) with the stay term's cap LIFTED -- the one
# change: `objective_stay` pays 0.5 for every turn a soldier stands inside its
# committed objective, to round 10, where the capped term stopped after four
# turns (`cap_per_commitment: 2.0`), so a squad that arrived at turn 5 had
# nothing to gain from holding by turn 9 (the walk-off CM9 and CM11 s1 showed).
# Arm CM12, paired with CM11 (same warm start per seed, same anchor flags).
# Below, the base config's header as written:
config_name: curriculum_a5_points_head_rf_pc_stay
number_of_wargame_models: 18
number_of_opponent_models: 0
number_of_objectives: 5
objective_radius_size: 4
board_width: 60
board_height: 44
max_groups: 6
number_of_battle_rounds: 10
deployment_zone: [2, 2, 10, 42]
opponent_deployment_zone: [50, 2, 58, 42]
models:
  - &sq_0 { group_id: 0 }
  - *sq_0
  - *sq_0
  - &sq_1 { group_id: 1 }
  - *sq_1
  - *sq_1
  - &sq_2 { group_id: 2 }
  - *sq_2
  - *sq_2
  - &sq_3 { group_id: 3 }
  - *sq_3
  - *sq_3
  - &sq_4 { group_id: 4 }
  - *sq_4
  - *sq_4
  - &sq_5 { group_id: 5 }
  - *sq_5
  - *sq_5
objectives:
  - { x: 30, y: 8 }
  - { x: 30, y: 22 }
  - { x: 30, y: 36 }
  - { x: 45, y: 15 }
  - { x: 45, y: 29 }
reward_phases:
  - name: arrive
    terminate_on_success: true
    terminal_success_bonus: 5.0
    reward_calculators:
      - type: closest_objective_v2
        weight: 1.0
        params:
          progress_scale: 2.0
          normalize_to_commit_distance: true
          normalize_min_distance: 12.0
          fallback_to_nearest: false
          overstack_penalty_per_extra: 0.0
      - type: objective_stay
        weight: 0.5
        params:
          crowding_exponent: 0.0
      - type: objective_coverage
        weight: 0.3
      - type: commitment_coverage
        weight: 0.3
    success_criteria:
      type: all_objectives_occupied
      params: {}
observe_objective_control: true
coherency:
  enforce_at_deployment: true
commitments:
  assignment: head
