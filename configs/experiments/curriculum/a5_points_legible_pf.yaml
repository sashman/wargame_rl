# #384, amendment 31 (2026-10-13): the half-step's ROTATED board -- the legibility
# rung's writer (every squad assigned the objective greedy gave the next squad)
# on `a5_points_head_pf_pcm.yaml`'s six squads and five objectives, success only
# when every squad is on ITS objective (`all_units_on_commitment`). The soldiers
# are paid exactly their stream under the head config (`plan_following` 0.5,
# `group_cohesion` 0.3, `terminal_member_success_bonus` 0.5); the planner's terms
# (`objective_coverage`, `commitment_coverage`, the 5.0 success lump) are
# dropped, since no planner trains here and under one writer they would be the
# soldiers'. Arm RB1, stage 1 (the soldiers on the rotated board, from scratch).
config_name: curriculum_a5_points_legible_pf
number_of_wargame_models: 18
number_of_opponent_models: 0
number_of_objectives: 5
objective_radius_size: 4
board_width: 60
board_height: 44
max_groups: 6
number_of_battle_rounds: 10
deployment_zone: [2, 2, 10, 42]
opponent_deployment_zone: [50, 2, 58, 42]
models:
  - &sq_0 { group_id: 0 }
  - *sq_0
  - *sq_0
  - &sq_1 { group_id: 1 }
  - *sq_1
  - *sq_1
  - &sq_2 { group_id: 2 }
  - *sq_2
  - *sq_2
  - &sq_3 { group_id: 3 }
  - *sq_3
  - *sq_3
  - &sq_4 { group_id: 4 }
  - *sq_4
  - *sq_4
  - &sq_5 { group_id: 5 }
  - *sq_5
  - *sq_5
objectives:
  - { x: 30, y: 8 }
  - { x: 30, y: 22 }
  - { x: 30, y: 36 }
  - { x: 45, y: 15 }
  - { x: 45, y: 29 }
reward_phases:
  - name: arrive
    terminate_on_success: true
    terminal_success_bonus: 0.0
    terminal_member_success_bonus: 0.5
    reward_calculators:
      - type: plan_following
        weight: 0.5
        params:
          max_move_distance: 6.0
      - type: group_cohesion
        weight: 0.3
        params: { group_max_distance: 6.0, violation_penalty: -0.05 }
    success_criteria:
      type: all_units_on_commitment
      params: {}
observe_objective_control: true
coherency:
  enforce_at_deployment: true
commitments:
  assignment: rotated
